<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101319">
  <meta name="description" content="База Honkai: Star Rail: персонажи, навыки, эйдолоны, конусы и реликвии.">
  <title>UniverseSolver</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="database.css"><link rel="stylesheet" href="planner.css">
  <script src="data/game-data.js" defer></script><script src="data/supplements.js" defer></script><script src="data/aha.js" defer></script><script src="database.js" defer></script><script src="optimizer-engine.js" defer></script><script src="equipment-effects.js" defer></script><script src="team-engine.js" defer></script><script src="set-engine.js" defer></script><script src="relic-engine.js" defer></script><script src="planner.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#plan"><span class="brand-icon">✧</span><span>UNIVERSE<span class="brand-light">SOLVER</span></span></a>
    <div class="game-label">HONKAI: STAR RAIL</div>
    <nav aria-label="Разделы">
      <a href="#plan" data-plan-link><span>◇</span> План команды</a>
      <a href="#characters" data-section="characters"><span>◈</span> Персонажи <small></small></a>
      <a href="#cones" data-section="cones"><span>▱</span> Конусы <small></small></a>
      <a href="#relics" data-section="relics"><span>❖</span> Реликвии <small></small></a>
    </nav>
    <div class="source-links"><a class="source-link" href="https://www.prydwen.gg/star-rail/" target="_blank" rel="noreferrer">Prydwen.gg ↗</a><a class="source-link" href="https://github.com/Mar-7th/StarRailRes" target="_blank" rel="noreferrer">StarRailRes ↗</a></div>
  </aside>
  <main id="characters">
    <div class="background-orbit" aria-hidden="true"><div class="orbit"><span>✧</span><b>✦</b></div></div>
    <header class="topbar"><strong id="breadcrumb">План команды</strong><span class="version">ALPHA 0.16</span></header>
    <section id="plan" aria-label="План команды"></section>
    <section id="catalog" aria-labelledby="roster-title" class="roster">
      <div class="section-heading"><h1 id="roster-title">Персонажи</h1><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Поиск по названию…" aria-label="Поиск по названию"></label></div>
      <div class="toolbar"><div id="elements" class="filters" role="group" aria-label="Тип урона"></div><div id="paths" class="filters" role="group" aria-label="Путь"></div><div id="rarities" class="filters" role="group" aria-label="Редкость"></div><div id="set-kinds" class="filters" role="group" aria-label="Тип набора" hidden></div></div>
      <div class="results-line"><span id="count" role="status" aria-live="polite"></span><button id="reset" class="reset" type="button" hidden>Сбросить фильтры ↺</button></div>
      <div id="grid" class="grid"></div><div id="empty" class="empty" hidden>Ничего не найдено.<p>Попробуй другое название или сбрось фильтры.</p></div>
    </section>
    <footer><span id="data-version"></span><span>Неофициальный проект · Иллюстрации © HoYoverse</span></footer>
  </main>
  <dialog id="profile" aria-labelledby="profile-name"><div class="dialog-top"><span class="eyebrow" id="detail-label"></span><button type="button" id="close" aria-label="Закрыть">✕</button></div><div class="profile-hero"><img id="profile-image" alt=""><div><p id="profile-meta"></p><h2 id="profile-name"></h2><div id="character-sources"></div></div></div><div id="detail-content"></div></dialog>
</body>
</html>
